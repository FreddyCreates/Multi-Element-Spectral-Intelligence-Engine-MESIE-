<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MESIE — Sovereign Spectral Intelligence</title>
  <link rel="stylesheet" href="../shared/mesie.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .hero { max-width: 1100px; margin: 4rem auto; padding: 0 2rem; text-align: center; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 1rem; }
    .hero p { font-size: 1.2rem; color: var(--muted); max-width: 700px; margin: 0 auto 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 2rem auto; padding: 0 2rem 4rem; }
    .biz h3 { margin-bottom: 0.5rem; }
    .biz .sku { font-family: var(--mono); font-size: 0.75rem; color: var(--phi); }
    nav { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin: 2rem 0; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <section class="hero">
    <span class="badge">v1.2.0 Production</span>
    <h1>MESIE</h1>
    <p>Multi-Element Spectral Intelligence Engine — sovereign agentic compute, universal MCP federation, 1,000 careers, dual-chain receipts.</p>
    <nav>
      <a href="../enterprise-4k/" class="btn btn-primary">Enterprise 4K App</a>
      <a href="../career-portal/" class="btn btn-ghost">Career Portal</a>
      <a href="../market-hub/" class="btn btn-ghost">Market Hub</a>
      <a href="https://github.com/FreddyCreates/Multi-Element-Spectral-Intelligence-Engine-MESIE" class="btn btn-ghost">GitHub</a>
    </nav>
  </section>
  <section class="grid" id="businesses"></section>
  <script>
    const BIZ = [
      { name: "Virtual Processor Enterprise", sku: "MESIE-VP-ENT", proof: "0.445ms · 256 dims" },
      { name: "Universal AI MCP", sku: "MESIE-UAI-MCP", proof: "12 tools · :8765" },
      { name: "Career MCP 1K", sku: "MESIE-CAREER-1K", proof: "1000 careers · :8767" },
      { name: "NOVA Swarm Runtime", sku: "NOVA-RT-70", proof: "70 careers · never-stop" },
      { name: "CloudColony Sovereign", sku: "CC-SOV-ICP", proof: "ICP · airgap" },
    ];
    document.getElementById("businesses").innerHTML = BIZ.map(b => `
      <article class="card biz">
        <div class="sku">${b.sku}</div>
        <h3>${b.name}</h3>
        <p class="muted">${b.proof}</p>
      </article>`).join("");
  </script>
</body>
</html>
