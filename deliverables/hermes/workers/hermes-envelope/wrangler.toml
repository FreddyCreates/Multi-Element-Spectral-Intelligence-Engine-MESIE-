# HERMES H05 — Federated Envelope
name = "mesie-hermes-envelope"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
HERMES_WORKER_ID = "hermes-envelope"
HERMES_SLOT = "H05"
NOVA_PROTOCOL = "NOVA-PROTOCOL-CLEAN-INTERNET/1.0"
BRAND = "ItsnotAILabs"

# Set at deploy: wrangler secret put MESIE_PROCESSOR_URL
# MESIE_PROCESSOR_URL = "https://your-edge-gateway.example"

[[routes]]
pattern = "/hermes/envelope*"
zone_name = "itsnotailabs.workers.dev"

# account_id = "ITSNOTAILABS_ACCOUNT"
